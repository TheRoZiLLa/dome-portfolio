<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Storytelling Automated Diagnostic Test</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    #log { white-space: pre-wrap; font-size: 14px; line-height: 1.5; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
  </style>
</head>
<body>
  <h2>Storytelling 3D Cinematic Diagnostics</h2>
  <div id="log">Running checks...\n</div>
  <div id="container-test" style="width: 800px; height: 600px; position: relative; border: 1px solid #333;"></div>

  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg, status = '') {
      const span = document.createElement('span');
      if (status === 'pass') span.className = 'pass';
      if (status === 'fail') span.className = 'fail';
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      console.log(msg);
    }

    window.onerror = (msg, url, line) => {
      log(`[ERROR] ${msg} at ${url}:${line}`, 'fail');
    };

    try {
      log('Importing Storytelling modules...');
      const { createStorytelling } = await import('/src/storytelling/index.js');
      log('Module imported successfully.', 'pass');

      log('Initializing Storytelling instance...');
      const controller = await createStorytelling({
        initialProgress: 0.18,
        autoMount: true
      });
      log('Storytelling instance initialized.', 'pass');

      // Check canvas
      const canvas = document.querySelector('.storytelling-canvas');
      if (canvas) {
        log(`Canvas found: ${canvas.width}x${canvas.height}`, 'pass');
      } else {
        log('No .storytelling-canvas found!', 'fail');
      }

      // Check progress scrubbing
      log('Testing progress scrubbing across scenes...');
      const scenes = [0.05, 0.18, 0.30, 0.42, 0.54, 0.65, 0.75, 0.85, 0.95];
      for (const p of scenes) {
        controller.setProgress(p);
        log(`Scrubbed to progress: ${p}`, 'pass');
      }

      log('Testing visual rendering at Scene 02 (progress 0.18)...');
      controller.setProgress(0.18);
      await new Promise(r => setTimeout(r, 600));

      const info = controller.rendererInfo || {};
      log(`Renderer Info: calls=${info.calls}, triangles=${info.triangles}, textures=${info.textures}`);

      log('ALL DIAGNOSTIC CHECKS PASSED!', 'pass');
    } catch (err) {
      log(`FATAL: ${err.message}\n${err.stack}`, 'fail');
    }
  </script>
</body>
</html>
